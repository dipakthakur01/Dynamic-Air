<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#070e17"/>
  <!-- Top Teal Box: Snowflake for Cooling -->
  <rect x="14" y="6" width="36" height="24" rx="5" fill="#00828a"/>
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="32" y1="10" x2="32" y2="26"/>
    <line x1="24" y1="18" x2="40" y2="18"/>
    <line x1="26.5" y1="12.5" x2="37.5" y2="23.5"/>
    <line x1="26.5" y1="23.5" x2="37.5" y2="12.5"/>
    <circle cx="32" cy="18" r="1.5" fill="#ffffff" stroke="none"/>
  </g>
  <!-- Bottom Amber Box: Sun for Heating -->
  <rect x="14" y="34" width="36" height="24" rx="5" fill="#ea9223"/>
  <circle cx="32" cy="46" r="4.2" fill="#ffffff"/>
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="38" x2="32" y2="40"/>
    <line x1="32" y1="52" x2="32" y2="54"/>
    <line x1="24" y1="46" x2="26" y2="46"/>
    <line x1="38" y1="46" x2="40" y2="46"/>
    <line x1="26.5" y1="40.5" x2="28" y2="42"/>
    <line x1="36" y1="50" x2="37.5" y2="51.5"/>
    <line x1="26.5" y1="51.5" x2="28" y2="50"/>
    <line x1="36" y1="42" x2="37.5" y2="40.5"/>
  </g>
</svg>
